# CleanUpSnap site (SKIN=cleanupsnap) + its own PostgreSQL database (as deployed on the Hostinger VPS, Docker manager project "cleanupsnap").
# Project environment (set on the server only, never in this repo):
#   DB_PASSWORD, ADMIN_PASSWORD, VAPID_PUBLIC, VAPID_PRIVATE,
#   NOINDEX=1 and SOON_HOSTS (while in development: e.g. SITE_HOSTS=dev.cleanupsnap.co.uk, cleanupsnap.co.uk and SOON_HOSTS=cleanupsnap.co.uk),
#   PREVIEW_KEY (optional link-only lock),
#   SITE_HOSTS=cleanupsnap.co.uk, REDIRECT_HOSTS=www.cleanupsnap.co.uk, cleanupsnap.com, www.cleanupsnap.com
# Updating the site: push to main, then restart the project (the web container clones main on start).
services:
  web:
    image: node:22-alpine
    command: ["sh", "-c", "apk add --no-cache git ffmpeg python3 py3-pillow >/dev/null && rm -rf /app && git clone --depth 1 https://github.com/Qr4-holding/snapthejob-site.git /app && cd /app && npm install --omit=dev --no-audit --no-fund && exec node server.js"]
    environment:
      - NODE_ENV=production
      - SKIN=cleanupsnap
      - PREVIEW_KEY=${PREVIEW_KEY}
      - NOINDEX=${NOINDEX}
      - SOON_HOSTS=${SOON_HOSTS}
      - DATABASE_URL=postgres://cus:${DB_PASSWORD}@db:5432/cus
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - VAPID_PUBLIC=${VAPID_PUBLIC}
      - VAPID_PRIVATE=${VAPID_PRIVATE}
    volumes:
      - backups:/backups:ro
      - media:/data/media
      - quotes:/data/quotes
    labels:
      caddy_0: ${SITE_HOSTS}
      caddy_0.reverse_proxy: "{{upstreams 3000}}"
      caddy_1: ${REDIRECT_HOSTS}
      caddy_1.redir: "https://cleanupsnap.co.uk{uri} permanent"
    networks:
      - web
      - internal
    depends_on:
      - db
    restart: unless-stopped
  backup:
    image: postgres:17-alpine
    environment:
      - PGPASSWORD=${DB_PASSWORD}
    command: ["sh", "-c", "sleep 30; while true; do pg_dump -h db -U cus cus | gzip > /backups/cus-$$(date +%Y-%m-%d).sql.gz && find /backups -name 'cus-*.sql.gz' -mtime +14 -delete; sleep 86400; done"]
    volumes:
      - backups:/backups
    networks:
      - internal
    depends_on:
      - db
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=cus
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=cus
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
networks:
  web:
    external: true
  internal: {}
volumes:
  pgdata: {}
  backups: {}
  media: {}
  quotes: {}
