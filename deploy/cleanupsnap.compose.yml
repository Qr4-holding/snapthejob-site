# CleanUpPic site (SKIN=cleanuppic; was CleanUpSnap) + its own PostgreSQL database (Hostinger VPS, Docker manager project "cleanupsnap").
# Project environment (set on the server only, never in this repo):
#   SKIN=cleanuppic, DB_PASSWORD, ADMIN_PASSWORD, VAPID_PUBLIC, VAPID_PRIVATE,
#   NOINDEX=1 and SOON_HOSTS (only while in development), PREVIEW_KEY (optional link-only lock),
#   SITE_HOSTS=cleanuppic.co.uk, dev.cleanupsnap.co.uk   REDIRECT_HOSTS=www.cleanuppic.co.uk, cleanupsnap.co.uk, www.cleanupsnap.co.uk   CANONICAL=https://cleanuppic.co.uk
#   Quote alerts to operators: BREVO_SMTP_LOGIN, BREVO_SMTP_KEY, MAIL_FROM (verified sender), QUOTE_EMAIL (default operator), QUOTE_CC (optional copy)
# Updating the site: push to main, then restart the project (the web container clones main on start).
services:
  web:
    image: node:22-alpine
    command: ["sh", "-c", "apk add --no-cache git ffmpeg python3 py3-pillow >/dev/null && rm -rf /app && git clone --depth 1 https://github.com/Qr4-holding/snapthejob-site.git /app && cd /app && npm install --omit=dev --no-audit --no-fund && exec node server.js"]
    environment:
      - NODE_ENV=production
      - SKIN=${SKIN}
      - PREVIEW_KEY=${PREVIEW_KEY}
      - NOINDEX=${NOINDEX}
      - SOON_HOSTS=${SOON_HOSTS}
      - DATABASE_URL=postgres://cus:${DB_PASSWORD}@db:5432/cus
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - VAPID_PUBLIC=${VAPID_PUBLIC}
      - VAPID_PRIVATE=${VAPID_PRIVATE}
      - BREVO_SMTP_LOGIN=${BREVO_SMTP_LOGIN}
      - BREVO_SMTP_KEY=${BREVO_SMTP_KEY}
      - MAIL_FROM=${MAIL_FROM}
      - QUOTE_EMAIL=${QUOTE_EMAIL}
      - QUOTE_CC=${QUOTE_CC}
    volumes:
      - backups:/backups:ro
      - media:/data/media
      - quotes:/data/quotes
    labels:
      caddy_0: ${SITE_HOSTS}
      caddy_0.reverse_proxy: "{{upstreams 3000}}"
      caddy_1: ${REDIRECT_HOSTS}
      caddy_1.redir: "${CANONICAL}{uri} permanent"
    networks:
      - web
      - internal
    depends_on:
      - db
    restart: unless-stopped
  backup:
    image: postgres:17-alpine
    environment:
      - PGPASSWORD=${DB_PASSWORD}
    command: ["sh", "-c", "sleep 30; while true; do pg_dump -h db -U cus cus | gzip > /backups/cus-$$(date +%Y-%m-%d).sql.gz && find /backups -name 'cus-*.sql.gz' -mtime +14 -delete; sleep 86400; done"]
    volumes:
      - backups:/backups
    networks:
      - internal
    depends_on:
      - db
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=cus
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=cus
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
networks:
  web:
    external: true
  internal: {}
volumes:
  pgdata: {}
  backups: {}
  media: {}
  quotes: {}
