# SnapTheJob site + its own PostgreSQL database (as deployed on the Hostinger VPS, Docker manager project "snapthejob").
# Project environment (set on the server only, never in this repo):
#   DB_PASSWORD, ADMIN_PASSWORD, SITE_HOSTS=snapthejob.co.uk, REDIRECT_HOSTS=www.snapthejob.co.uk, srv2079067.hstgr.cloud
# Updating the site: push to main, then restart the project (the web container clones main on start).
services:
  web:
    image: node:22-alpine
    command: ["sh", "-c", "apk add --no-cache git >/dev/null && rm -rf /app && git clone --depth 1 https://github.com/Qr4-holding/snapthejob-site.git /app && cd /app && npm install --omit=dev --no-audit --no-fund && exec node server.js"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://stj:${DB_PASSWORD}@db:5432/stj
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    labels:
      caddy_0: ${SITE_HOSTS}
      caddy_0.reverse_proxy: "{{upstreams 3000}}"
      caddy_1: ${REDIRECT_HOSTS}
      caddy_1.redir: "https://snapthejob.co.uk{uri} permanent"
    networks:
      - web
      - internal
    depends_on:
      - db
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=stj
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=stj
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
networks:
  web:
    external: true
  internal: {}
volumes:
  pgdata: {}
