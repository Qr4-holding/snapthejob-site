<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{NAME}} · Before, After, Share.</title>
<meta name="description" content="{{DESC}}">
<meta name="theme-color" content="{{THEME}}">
<meta property="og:title" content="{{NAME}} · Before, After, Share.">
<meta property="og:description" content="{{DESC}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="{{NAME}}">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="{{FONTS}}" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css?v=13">
{{HEAD}}
</head>
<body>
<header class="top"><div class="wrap">
<a class="logo" href="/" aria-label="{{NAME}} home">
<span class="mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
{{LOGO_WORD}}
</a>
<form class="search" id="searchForm" action="/" role="search">
<label class="sr" for="q">{{SEARCH_LABEL}}</label>
<input id="q" name="q" type="search" placeholder="{{SEARCH_PH}}">
<button type="submit" aria-label="Search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
</form>
{{HEADER_ACTIONS}}
</div></header>
<main class="wrap">
<nav class="chips" id="chips" aria-label="{{CHIPS_LABEL}}"></nav>
<div class="viewbar"><h2 class="disp" id="feedTitle">{{FEED_TITLE}}</h2>
<div style="display:flex;gap:8px;align-items:center">
<button class="follow follow-site" type="button" data-follow="{{ID}}" data-follow-name="{{NAME}}" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 004 0"/></svg><span class="fl">Follow {{NAME}}</span></button>
<div class="toggle" role="group" aria-label="Layout">
<button type="button" data-view="grid" aria-label="Two per row"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></button>
<button type="button" data-view="list" aria-label="One per row, full size"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 3h14v18H5z"/></svg></button>
</div></div></div>
<section class="grid" id="grid" aria-live="polite"></section>
</main>
<footer class="foot"><div class="wrap">
{{DISCLAIMER}}
<!--TRADE_LINKS-->
<p style="margin:0"><a href="/privacy">Privacy</a> · <a href="/contact">Contact</a> · <a href="/app">Get the app</a> · © 2026 {{NAME}}</p>
</div></footer>
{{TABBAR}}
<script src="/assets/jobs.js?v=11"></script>
<script src="/assets/site.js?v=13"></script>
{{BODY_END}}
</body>
</html>
