<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact · {{NAME}}</title>
<meta name="description" content="Get in touch with {{NAME}}.">
<meta name="theme-color" content="{{THEME}}">
<meta property="og:title" content="Contact · {{NAME}}">
<meta property="og:description" content="Get in touch with {{NAME}}.">
<meta property="og:image" content="{{OG_IMAGE}}">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="{{NAME}}">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="{{FONTS}}" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css?v=16">
{{HEAD}}
</head>
<body>
<header class="top"><div class="wrap">
<a class="logo" href="/" aria-label="{{NAME}} home">
<span class="mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
{{LOGO_WORD}}
</a>
<form class="search" id="searchForm" action="/" role="search">
<label class="sr" for="q">{{SEARCH_LABEL}}</label>
<input id="q" name="q" type="search" placeholder="{{SEARCH_PH}}">
<button type="submit" aria-label="Search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
</form>
{{HEADER_ACTIONS}}
</div></header>
<main class="wrap" style="max-width:640px;padding-top:24px;padding-bottom:20px">
<h1 class="disp" style="font-size:38px;margin:0 0 6px">Contact us</h1>
<p style="margin:0 0 18px">Send us a message and we'll reply by email.</p>
<form id="contactForm" novalidate style="display:flex;flex-direction:column;gap:14px">
<label class="hp" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
<div class="row">
<label class="f">Your name<input name="name" autocomplete="name"></label>
<label class="f">Email<input name="email" type="email" autocomplete="email" inputmode="email"></label>
</div>
<label class="f">What's it about?<select name="topic">
<option>General question</option><option>{{I_AM}}</option><option>See, change or delete my details</option><option>Unsubscribe me</option><option>Press or partnership</option><option>Report a video</option>
</select></label>
<label class="f">Message<textarea name="message" style="min-height:140px"></textarea></label>
<div class="err" id="cErr" role="alert"></div>
<button class="send disp" type="submit" id="cSend">Send message</button>
<p class="small" style="margin:0;text-align:center">We only use your details to reply. <a href="/privacy">Privacy</a></p>
</form>
<div class="done" id="cDone" hidden>
<span class="tick"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>
<span class="disp" style="font-size:26px">Message sent</span>
<span style="font-size:16px">Thanks. We'll reply by email.</span>
<a class="btn" href="/">Back to {{NAME}}</a>
</div>
</main>
<footer class="foot"><div class="wrap">
{{DISCLAIMER}}
<p style="margin:0"><a href="/privacy">Privacy</a> · <a href="/contact">Contact</a> · <a href="/app">Get the app</a> · © 2026 {{NAME}}</p>
</div></footer>
{{TABBAR}}
<script src="/assets/jobs.js?v=12"></script>
<script src="/assets/site.js?v=15"></script>
{{BODY_END}}
</body>
</html>
